[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-licitacao"
version = "0.1.0"
description = "Sistema de apoio a licitacoes: ingestao documental rastreavel"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.13.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
